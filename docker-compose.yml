version: "3.9"

services:
  api:
    build: .
    container_name: movie_api
    ports:
      - "8000:8000"
    env_file:
      - .env  
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: movie_db
    environment:
      POSTGRES_USER: project_user  
      POSTGRES_PASSWORD: StrongProjectPassword123  
      POSTGRES_DB: project_db  
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
volumes:
  postgres_data: